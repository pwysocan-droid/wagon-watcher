name: heartbeat

# Watchdog for the watcher. Deliberately a separate workflow on a slow
# schedule: `watch.yml` cannot report its own absence, and low-frequency
# crons are dropped far less often than the every-30-minutes one this
# checks on (see heartbeat.py for the 2026-08-27 degradation).
on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours, off the hour to dodge peak load
  workflow_dispatch:

concurrency:
  group: heartbeat
  cancel-in-progress: false

permissions:
  contents: write   # the alert writes a notifications row + alerts/ entry

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install runtime dependencies
        run: pip install --quiet -r requirements.txt

      - name: Check watcher freshness
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
          PUSHOVER_ENABLED: "true"
          STALE_AFTER_HOURS: "18"
        run: python heartbeat.py

      - name: Commit alert state
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/inventory.db alerts/
          if git diff --cached --quiet; then
            echo "No stall alert to record"
          else
            git commit -m "heartbeat: watcher stall alert"
            git pull --rebase --autostash origin main || true
            git push
          fi
